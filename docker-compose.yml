services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: icloud_mail
      POSTGRES_USER: icloud_mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icloud_mail -d icloud_mail"]
      interval: 5s
      timeout: 3s
      retries: 20
  icloud-mail:
    image: ghcr.io/biubiubiu125/icloud-mail:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ICLOUD_MAIL_HTTP_ADDR: ":8080"
      ICLOUD_MAIL_DATABASE_URL: postgres://icloud_mail:${POSTGRES_PASSWORD}@postgres:5432/icloud_mail?sslmode=disable
      ICLOUD_MAIL_ADMIN_USERNAME: ${ICLOUD_MAIL_ADMIN_USERNAME:?set admin username}
      ICLOUD_MAIL_ADMIN_PASSWORD: ${ICLOUD_MAIL_ADMIN_PASSWORD:?set admin password}
      ICLOUD_MAIL_API_KEY: ${ICLOUD_MAIL_API_KEY:-}
      ICLOUD_MAIL_PUBLIC_BASE_URL: ${ICLOUD_MAIL_PUBLIC_BASE_URL:-}
      ICLOUD_MAIL_COOKIE_SECURE: ${ICLOUD_MAIL_COOKIE_SECURE:-false}
      ICLOUD_MAIL_HALT_FILE: /var/lib/icloud-mail/create-halt.json
    volumes:
      - halt:/var/lib/icloud-mail
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
  halt:
